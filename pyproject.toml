[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fq-ssiuu"
version = "0.1.0.dev0"
description = "FQ-SSIUU: Verifiable LLM Unlearning Against Quantisation Recovery Attacks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
keywords = ["machine-unlearning", "llm", "quantisation", "privacy", "gdpr"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "datasets>=2.16.0",
    "accelerate>=0.26.0",
    "peft>=0.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tqdm>=4.66.3",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
quantisation = [
    "bitsandbytes>=0.45.0,<0.46.0",
]
attribution = [
    "captum>=0.7.0,<0.8.0",
]
evaluation = [
    "hydra-core>=1.3.2,<1.4.0",
    "lm-eval>=0.4.7,<0.5.0",
    "jsonlines>=4.0.0,<5.0.0",
]
drive = [
    "google-api-python-client>=2.194.0",
    "google-auth>=2.47.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.0",
    "mypy>=1.8.0",
]

[project.scripts]
fq-ssiuu-preflight = "fq_ssiuu.environment:preflight_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
extend-exclude = ["experiments/reproductions/*/historical"]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.package-data]
"fq_ssiuu" = ["py.typed"]
