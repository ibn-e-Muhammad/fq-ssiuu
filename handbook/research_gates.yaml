  - id: "RG-002"
    title: "Quantisation Location Mismatch"
    category: "Method Validity"
    status: "BLOCKED"
    blocks_training: true
    blocks_evaluation: true
    blocked_conditions: ["C5", "C6", "C7"]
    dependencies: []
    source_citations: ["FQ-SSIUU Design Intent"]
    verification_command: "pytest tests/historical/FQ_QAT/test_quantisation_location.py"
    required_evidence: "Behavioral comparison of training and deployment merged-weight NF4 codebook/block/scale semantics, gradient and disabled-path tests plus corrected P3. A metadata flag or ablation label cannot close this gate."
    validating_commit: null
    validation_date: null
    rationale: "Training-time FQ applies symmetric INT4 QDQ to adapter output activations. Deployment NF4 applies the NF4 codebook to merged model weights. These are different operations."

  - id: "RG-003"
    title: "QUAIL Fidelity"
    category: "Method Validity"
    status: "BLOCKED"
    blocks_training: true
    blocks_evaluation: false
    blocked_conditions: ["C8"]
    dependencies: []
    source_citations: ["arXiv:2601.15538v1"]
    verification_command: "pytest tests/historical/QUAIL/test_quail_loss.py"
    required_evidence: "Complete published forget/retain/all-logit hinge objective, coefficients and margin; independent numerical/masking/gradient tests and corrected P4. Historical hinge tests cannot close this gate."
    validating_commit: null
    validation_date: null
    rationale: "Current implementation has hinge loss only (no forget loss, no retain loss), uses margin 4.2e-4 (published: 1.0/2), and has no loss weighting coefficients."

  - id: "RG-004"
    title: "TOFU Forget Quality Interpretation"
    category: "Evaluation Validity"
    status: "OPEN"
    blocks_training: false
    blocks_evaluation: true
    blocked_conditions: []
    dependencies: []
    source_citations: ["arXiv:2401.06121v1"]
    verification_command: "grep -r 'forget quality' handbook/"
    required_evidence: "All documentation must interpret FQ as a KS p-value, not a direct distance metric or magnitude."
    validating_commit: null
    validation_date: null
    rationale: "FQ is a KS p-value comparing unlearned model vs retain-only oracle. Larger p-value = less evidence against null. It is not a direct distance."
