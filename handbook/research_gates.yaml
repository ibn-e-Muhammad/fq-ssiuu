gates:
  - id: "RG-005"
    title: "QRA Outcome Definition and Directional Metric Validity"
    category: "Evaluation Validity"
    status: "BLOCKED"
    blocks_training: true
    blocks_evaluation: true
    blocked_conditions: ["ALL_CORRECTED_PILOTS", "EMPIRICAL_DURABILITY_REPORT"]
    dependencies: ["RG-004"]
    source_citations: ["arXiv:2401.06121v1", "arXiv:2410.16454v2"]
    verification_command: "pytest tests/methods/QRA"
    required_evidence: "Directional metric definitions, matched sample/checkpoint provenance, separate nullable attack_detected/durability_pass, behavioral tests, approved versioned decision rule before any scientific verdict."
    validating_commit: null
    validation_date: null
    rationale: "Ratios or differences of KS p-values do not measure recovery. Historical attack PASS was inverted into a durability PASS. All corrected pilots and durability verdicts are blocked pending an interpretable outcome contract."

  - id: "RG-006"
    title: "NPO Reference Parity"
    category: "Method Validity"
    status: "RESOLVED"
    blocks_training: true
    blocks_evaluation: false
    blocked_conditions: ["NPO_REPRODUCTION", "C2", "C4", "C5", "C6", "C7"]
    dependencies: []
    source_citations: ["arXiv:2404.05868v2", "locuslab/open-unlearning@4ad738aaf60f6a4385f6e2506d01da99e76c31f3"]
    verification_command: "pytest tests/methods/NPO"
    required_evidence: "Values and current/retain gradients match both pinned upstreams; explicit NPO versus NPO+RT distinction; causal answer/EOS masking and frozen reference behavior; recorded adaptations before corrected 1B reproduction."
    validating_commit: "318e523ac302f9f80f2c74f7c712bff08ff96a8e"
    validation_date: "2026-09-22"
    rationale: "Resolved for objective/data/reference conformance: prior dual-upstream objective parity, four real pinned-tokenizer rows compared with executed upstream preprocessing, CPU negative/reference tests, and four-example frozen unquantized FP16/no_grad runtime passed on one T4. Run 20260922-101703-ce77656bee84, evidence handbook/evidence/work_unit_b/20260922_attempt1_318e523a/VERDICT.json. Explicit chat return-type, EOS-attention and truncation adaptations are documented. No cache, training reproduction, corrected pilot or effectiveness claim; RG-005 still blocks pilots."
  - id: "RG-001"
    title: "SSIUU Gradient Flow"
    category: "Method Validity"
    status: "BLOCKED"
    blocks_training: true
    blocks_evaluation: false
    blocked_conditions: ["C4", "C6", "C7"]
    dependencies: []
    source_citations: ["arXiv:2509.22263v2"]
    verification_command: "pytest tests/historical/SSIUU/test_ssiuu_gradient_flow.py"
    required_evidence: "Published parameter attribution, current/previous state, negative-index selection, first-step zero and HVP reference tests; non-zero regularisation gradients and measured single-T4 training memory. Historical regression command cannot close this gate."
    validating_commit: null
