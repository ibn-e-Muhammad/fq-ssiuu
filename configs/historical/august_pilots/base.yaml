# configs/base.yaml
# Shared defaults for all experiments.
# Override these in condition-specific configs.
# Format: OmegaConf — use ${base.field} to reference values.

project:
  name: "fq-ssiuu"
  version: "0.1.0-dev"
  description: "Verifiable LLM Unlearning Against Quantisation Recovery Attacks"
  gdrive_base: "My Drive/fq-ssiuu-research"

model:
  base_model_id: "meta-llama/Llama-3.2-1B-Instruct"
  hf_token: null  # Set via HF_TOKEN environment variable — never hardcode here
  quantisation:
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    # T4 does not support BF16, using FP16
    bnb_4bit_compute_dtype: "float16"
    bnb_4bit_use_double_quant: true
  torch_dtype: "float16"
  device_map: "auto"

lora:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  lr: 1.0e-5
  weight_decay: 0.01
  num_epochs: 10
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  optimizer: "paged_adamw_32bit"
  lr_scheduler: "cosine"
  gradient_checkpointing: true
  save_every_epoch: true

dataset:
  name: "tofu"
  forget_split: "forget05"
  retain_split: "retain90"
  max_length: 512

evaluation:
  batch_size: 8
  max_new_tokens: 200
  temperature: 1.0
  n_samples_fade: 20  # Use 100 for final results; 20 for rapid iteration

qra:
  nf4_bin_width: 8.4e-4  # Empirical value from MANSU (arXiv:2605.15138)
  certification_threshold: 0.05  # Q-INT4 < 0.05 → certified

seeds:
  primary: [42, 123, 456]
  pilot: [42]  # Single seed for pilot experiments

logging:
  log_every_n_steps: 10
  save_metrics_every_epoch: true
