name: CI

on:
  push:
    branches: [dev, "stage/**", "pilot/**", "exp/**"]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight dependencies (CI — no torch, no GPU)
        run: |
          pip install ruff==0.4.0 pytest==8.3.0 pytest-cov==5.0.0 \
            numpy==1.26.4 scipy==1.14.0 pyyaml==6.0.1 omegaconf==2.3.0 \
            typer==0.12.0 rich==13.7.0
          pip install -e . --no-deps

      - name: Lint with ruff
        run: |
          ruff check src/ tests/ --output-format=github
          ruff format --check src/ tests/

      - name: Run unit tests (CPU only — no model loading)
        run: |
          pytest tests/ -v --tb=short -m "not requires_gpu and not requires_model"
        env:
          CI: "true"
